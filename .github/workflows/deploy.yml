name: GitHub Pages 배포

# main 브랜치에 올리면 자동으로 빌드해서 배포합니다.
# 도안을 추가할 때도 src/data/patterns.ts 만 고쳐 올리면 몇 분 뒤 반영됩니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm ci || npm install

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 빌드
        # 재고 서버 주소와 열쇠는 저장소 Secrets 에서 주입합니다.
        env:
          VITE_STOCK_API: ${{ secrets.VITE_STOCK_API }}
          VITE_STOCK_KEY: ${{ secrets.VITE_STOCK_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
